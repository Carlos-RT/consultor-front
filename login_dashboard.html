<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Login Admin</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border:1px solid #ccc;
}

input,button{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:#3498db;
color:white;
border:none;
}
</style>

</head>

<body>

<div class="container">

<h2>Login Administrador</h2>

<input id="usuario" placeholder="Usuario">
<input id="password" type="password" placeholder="Contraseña">

<button onclick="login()">Iniciar sesión</button>

</div>

<script>

const API_URL="https://consultor-back.vercel.app"

async function login(){

const usuario=document.getElementById("usuario").value.trim()
const password=document.getElementById("password").value.trim()

if(!usuario || !password){
alert("Complete los campos")
return
}

const res=await fetch(`${API_URL}/login-admin`,{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({usuario,password})

})

const data=await res.json()

if(res.ok){

localStorage.setItem("adminId",data.id)
localStorage.setItem("adminNombre",data.nombre)

// 🔴 // NUEVO
localStorage.setItem("oficinaId",data.oficinaId)

window.location.href="web_dashboard.html"

}else{

alert(data.mensaje)

}

}

</script>

</body>
</html>
