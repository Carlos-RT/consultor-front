<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Administrador</title>

<style>

body{
font-family:Arial;
background:#e5e5e5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
width:100%;
max-width:400px;
background:white;
padding:20px;
border:1px solid #ccc;
}

input,button{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:black;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="box">

<h3>Login Administrador</h3>

<input id="usuario" placeholder="Usuario">
<input id="password" type="password" placeholder="Contraseña">

<button onclick="loginAdmin()">Ingresar</button>

</div>

<script>

const API_URL="https://consultor-back.vercel.app"

async function loginAdmin(){

const usuario=document.getElementById("usuario").value
const password=document.getElementById("password").value

const res=await fetch(`${API_URL}/login-admin`,{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({usuario,password})

})

if(!res.ok){
alert("Credenciales incorrectas")
return
}

const data=await res.json()

localStorage.setItem("adminId",data.id)
localStorage.setItem("adminNombre",data.nombre)

window.location.href="web_dashboard.html"

}

</script>

</body>
</html>
