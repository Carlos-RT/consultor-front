<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Super Admin</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border:1px solid #ccc;
}

input,button{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:#3498db;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Login Super Admin</h2>

<input id="usuario" placeholder="Usuario">
<input id="password" placeholder="Contraseña" type="password">

<button onclick="login()">Iniciar sesión</button>

</div>

<script>

const API_URL = "https://consultor-back.vercel.app"

async function login(){

const usuario = document.getElementById("usuario").value.trim()
const password = document.getElementById("password").value.trim()

if(!usuario || !password){
alert("Complete todos los campos")
return
}

const res = await fetch(`${API_URL}/login-superadmin`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({usuario,password})
})

const data = await res.json()

if(res.ok){

localStorage.setItem("superAdminId",data.id)
localStorage.setItem("superAdminNombre",data.nombre)

window.location.href="superadmin_dashboard.html"

}else{

alert(data.mensaje)

}

}

</script>

</body>
</html>
