<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Super Admin</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border:1px solid #ccc;
}

input,button{
width:100%;
padding:10px;
margin-bottom:10px;
}

.login{
background:#3498db;
color:white;
border:none;
}

.crear{
background:#27ae60;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Super Admin</h2>

<input id="nombre" placeholder="Nombre (solo para crear)">
<input id="usuario" placeholder="Usuario">
<input id="password" type="password" placeholder="Contraseña">

<button class="login" onclick="login()">Iniciar sesión</button>

<hr>

<h3>Crear Super Admin</h3>

<button class="crear" onclick="crearSuperAdmin()">Crear Super Admin</button>

</div>

<script>

const API_URL = "https://consultor-back.vercel.app"

async function login(){

const usuario = document.getElementById("usuario").value.trim()
const password = document.getElementById("password").value.trim()

if(!usuario || !password){
alert("Ingrese usuario y contraseña")
return
}

const res = await fetch(`${API_URL}/login-superadmin`,{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({usuario,password})

})

const data = await res.json()

if(res.ok){

localStorage.setItem("superAdminId",data.id)
localStorage.setItem("superAdminNombre",data.nombre)

window.location.href="superadmin_dashboard.html"

}else{

alert(data.mensaje)

}

}

async function crearSuperAdmin(){

const nombre = document.getElementById("nombre").value.trim()
const usuario = document.getElementById("usuario").value.trim()
const password = document.getElementById("password").value.trim()

if(!nombre || !usuario || !password){
alert("Complete todos los campos")
return
}

const res = await fetch(`${API_URL}/crear-superadmin`,{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nombre,
usuario,
password
})

})

const data = await res.json()

if(res.ok){

alert("Super admin creado correctamente. Ahora puede iniciar sesión.")

}else{

alert(data.mensaje || "Error creando super admin")

}

}

</script>

</body>
</html>
